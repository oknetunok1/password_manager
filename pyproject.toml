[project]
name = "password-manager"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "Evgrafov Viktor", email = "167799713+oknetunok1@users.noreply.github.com" }
]
requires-python = ">=3.11"
dependencies = [
    "cryptography>=50.0.2",
]

[project.scripts]
password-manager = "password_manager:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",    # Ошибки
    "F",    # Логические ошибки и неиспользуемые переменные
    "I",    # Сортировка импортов
    "B",    # Потенциальные баги и антипаттерны
    "UP",   # Устаревший синтаксис Python
    "N",    # Именование по PEP 8
]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpths = ["tests"]
pythonpath = ["src"]